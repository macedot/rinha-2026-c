x-api-common: &api-common
  build: .
  networks:
    - rinha-c-net
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  deploy:
    resources:
      limits:
        cpus: "0.4"
        memory: "160M"

services:
  nginx:
    image: nginx:alpine
    container_name: rinha-c-nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - rinha-c-net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "50M"

  api1:
    <<: *api-common
    container_name: rinha-c-api1
    hostname: api1
    environment:
      INDEX_PATH: "/app/resources/index.bin"
      LISTEN_TCP: "1"
      PORT: "8080"
      IVF_NPROBE: "8"
      IVF_FULL_NPROBE: "24"
      CANDIDATES: "0"

  api2:
    <<: *api-common
    container_name: rinha-c-api2
    hostname: api2
    environment:
      INDEX_PATH: "/app/resources/index.bin"
      LISTEN_TCP: "1"
      PORT: "8080"
      IVF_NPROBE: "8"
      IVF_FULL_NPROBE: "24"
      CANDIDATES: "0"

networks:
  rinha-c-net:
    driver: bridge
