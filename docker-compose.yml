x-api-common: &api-common
  build: .
  volumes:
    - rinha-c-sock:/run/sock
  networks:
    - rinha-c-net
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  deploy:
    resources:
      limits:
        cpus: "0.4"
        memory: "150M"
  environment: &api-env
    INDEX_PATH: "/app/resources/index.bin"
    UDS_PATH: "/run/sock/api.sock"
    UDS_MODE: "666"
    UNLINK_UDS: "1"
    IVF_NPROBE: "5"
    IVF_FULL_NPROBE: "24"
    CANDIDATES: "0"
  # No security_opt:unconfined - using standard HAProxy + UDS sockets

services:
  lb:
    image: haproxy:2.9-alpine
    container_name: rinha-c-lb
    restart: always
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    volumes:
      - rinha-c-sock:/run/sock
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-V"]
    networks:
      - rinha-c-net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30M"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # No security_opt required - official HAProxy image + UDS backends

  api1:
    <<: *api-common
    container_name: rinha-c-api1
    environment:
      <<: *api-env
      UDS_PATH: "/run/sock/api1.sock"

  api2:
    <<: *api-common
    container_name: rinha-c-api2
    environment:
      <<: *api-env
      UDS_PATH: "/run/sock/api2.sock"

networks:
  rinha-c-net:
    driver: bridge

volumes:
  rinha-c-sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
