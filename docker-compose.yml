x-api-common: &api-common
  image: ghcr.io/macedot/rinha-2026-c:0.3.1
  volumes:
    - rinha-c-sock:/run/sock
  networks:
    - rinha-c-net
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "125M"
  environment: &api-env
    INDEX_PATH: "/app/data"
    UDS_PATH: "/run/sock/api.sock"
    UDS_MODE: "666"
    UNLINK_UDS: "1"

services:
  lb:
    image: haproxy:2.9-alpine
    container_name: rinha-c-lb
    restart: always
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    volumes:
      - rinha-c-sock:/run/sock
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-V"]
    networks:
      - rinha-c-net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30M"

  api1:
    <<: *api-common
    container_name: rinha-c-api1
    environment:
      <<: *api-env
      UDS_PATH: "/run/sock/api1.sock"
    cpuset: "0"

  api2:
    <<: *api-common
    container_name: rinha-c-api2
    environment:
      <<: *api-env
      UDS_PATH: "/run/sock/api2.sock"
    cpuset: "1"

networks:
  rinha-c-net:
    driver: bridge

volumes:
  rinha-c-sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m